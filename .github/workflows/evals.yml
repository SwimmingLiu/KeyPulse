name: evals

# Runs the plugin eval suite (`claude plugin eval`). These are real model calls,
# so the job is opt-in: on a schedule, or by manual dispatch.
#
# Credential: one repository secret, EVAL_ANTHROPIC_KEY, holding an
# Anthropic-protocol key for whatever upstream EVAL_ANTHROPIC_BASE_URL names.
# The workflow itself just points Claude Code at that upstream — no local
# gateway, which a runner could never reach.
#
# A missing secret FAILS this job instead of reporting success. A green run
# here means the suite actually executed; "nothing ran" must never look like
# a pass.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC

env:
  # Evaluated once per workflow run; every step sees the same upstream.
  EVAL_MODEL: deepseek-v4-1-flash-1017
  EVAL_BASE_URL: https://betteryou.top

jobs:
  evals:
    name: plugin evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require EVAL_ANTHROPIC_KEY
        env:
          KEY: ${{ secrets.EVAL_ANTHROPIC_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            exit 0
          fi
          echo "::error::EVAL_ANTHROPIC_KEY is not set. Add the eval key with:"
          echo "::error::  gh secret set EVAL_ANTHROPIC_KEY -R $GITHUB_REPOSITORY"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install sandbox dependencies
        # `claude plugin eval` grants Bash only through a confined shell. On
        # Linux that confinement needs bubblewrap + socat; without them every
        # run is refused before it starts (0 turns, score 0). The ubuntu-latest
        # image ships bwrap but not socat.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          socat -V | head -1
          bwrap --version

      - name: Validate plugin
        run: claude plugin validate . --strict

      - name: Check replay recordings
        # Cases replay recorded provider values, so the suite needs no network
        # and no browser. This asserts each case still ships a usable recording.
        run: python evals/fixtures/verify_recording.py

      - name: Run eval suite
        env:
          # Point every model tier at the upstream and clear the Anthropic
          # defaults, so an unset secret can never silently fall back to a
          # hosted account. Bash is needed for the CLI; Skill must be granted
          # or the agent cannot load the plugin skill in this sandbox. 0.8
          # lets one grader miss.
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.EVAL_ANTHROPIC_KEY }}
          ANTHROPIC_BASE_URL: ${{ env.EVAL_BASE_URL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ env.EVAL_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ env.EVAL_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ env.EVAL_MODEL }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ env.EVAL_MODEL }}
        run: |
          claude plugin eval . \
            --trust-plugin --no-publish --scaffold \
            --allow-tools Bash Read Grep Glob Skill \
            --ablation none --runs 1 --threshold 0.8 \
            --json evals/results/aggregate.json \
            --output-dir evals/results \
            --keep-temp

      - name: Upload eval report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Temps are kept so a failing grader can be diagnosed from the
          # model's actual output instead of guessed at.
          name: eval-results
          path: |
            evals/results
            /tmp/claude-eval-*
            /tmp/e-*
          if-no-files-found: warn
          include-hidden-files: true
