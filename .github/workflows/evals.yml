name: evals

# Runs the plugin eval suite (`claude plugin eval`). These are real model calls,
# so the job is opt-in: on a schedule, or by manual dispatch.
#
# Either credential works, as a repository secret:
#   ANTHROPIC_API_KEY        a paid API key
#   CLAUDE_CODE_OAUTH_TOKEN  a Claude subscription token from `claude setup-token`
#
# A missing credential FAILS this job instead of reporting success. A green run
# here means the suite actually executed; "nothing ran" must never look like a
# pass.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC

jobs:
  evals:
    name: plugin evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Require a credential
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            exit 0
          fi
          echo "::error::No eval credential is configured. Add one of:"
          echo "::error::  gh secret set ANTHROPIC_API_KEY -R $GITHUB_REPOSITORY"
          echo "::error::  gh secret set CLAUDE_CODE_OAUTH_TOKEN -R $GITHUB_REPOSITORY  # from: claude setup-token"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin
        run: claude plugin validate . --strict

      - name: Check replay recordings
        # Cases replay recorded provider values, so the suite needs no network
        # and no browser. This asserts each case still ships a usable recording.
        run: python evals/fixtures/verify_recording.py

      - name: Run eval suite
        # Bash is needed for the CLI; Skill must be granted or the agent cannot
        # load the plugin skill in this sandbox. 0.8 lets one grader miss.
        run: |
          claude plugin eval . \
            --trust-plugin --no-publish --scaffold \
            --allow-tools Bash Read Grep Glob Skill \
            --ablation none --runs 1 --threshold 0.8 \
            --judge-model claude-haiku-4-5 \
            --json evals/results/aggregate.json \
            --output-dir evals/results

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results
          if-no-files-found: warn
