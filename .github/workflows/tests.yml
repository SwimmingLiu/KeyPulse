name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q src bin/keypulse
      - name: Verify eval recordings
        run: python evals/fixtures/verify_recording.py
      - name: Verification skill smoke test
        # Proves the generated verify-keypulse skill still works: doctor, three
        # recipes, a failure path, and evidence surviving cleanup. Offline.
        run: .claude/skills/verify-keypulse/scripts/smoke.sh ci-${{ github.run_id }}

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin and marketplace
        # The validator ships with Claude Code; install it without login.
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
